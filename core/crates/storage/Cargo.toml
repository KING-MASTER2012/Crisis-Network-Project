[package]
name = "storage"
description = "Crisis Network on-device message store (SQLite): append-only log, tombstones, quotas, peers."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Bundled SQLite (default). The same crate also works against SQLCipher: an application
# that wants at-rest encryption enables a SQLCipher feature on `rusqlite` in its own
# manifest (for example `bundled-sqlcipher-vendored-openssl`), and `Storage::open`
# detects it at run time. Nothing here pulls in OpenSSL.
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
proto.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
