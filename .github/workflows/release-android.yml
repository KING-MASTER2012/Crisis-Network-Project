# Builds the signed Android release (phase A7). Runs for a tag `android-v<version>` or by hand.
# Needs these repository secrets (see clients/android/RELEASING.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android release

on:
    push:
        tags:
            - "android-v*"
    workflow_dispatch:
        inputs:
            version_name:
                description: "versionName (for example 0.7.0)"
                required: true
            version_code:
                description: "versionCode (a number that is higher than that of every earlier release)"
                required: true

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        env:
            # The tag android-v1.2.3 gives versionName 1.2.3; the code is the run number unless it is given by hand.
            VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
            VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        steps:
            - uses: actions/checkout@v4
            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
                  sudo docker image prune --all --force || true
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: android-actions/setup-android@v3
              with:
                  packages: "platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358"
            - name: Install cargo-ndk
              run: cargo install cargo-ndk --locked
            - uses: gradle/actions/setup-gradle@v4
            - name: Make the Gradle wrapper executable
              run: chmod +x clients/android/gradlew
            # The keystore only exists on the runner for this job; the secrets are never printed.
            - name: Restore the signing key
              env:
                  KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
              run: |
                  test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
                  echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            # Release native core (LTO) with SQLCipher: the app refuses to open a plaintext database in a release.
            - name: Build the signed APK and bundle
              working-directory: clients/android
              timeout-minutes: 90
              env:
                  CRISIS_SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
                  CRISIS_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  CRISIS_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  CRISIS_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  name="${VERSION_NAME#android-v}"
                  ./gradlew :app:assembleRelease :app:bundleRelease \
                      -Pcrisis.sqlcipher=true -Pcrisis.rustProfile=release \
                      -Pcrisis.versionName="$name" -Pcrisis.versionCode="$VERSION_CODE" \
                      --console=plain --stacktrace
            - name: Verify the signature and the alignment
              run: |
                  apk=$(ls clients/android/app/build/outputs/apk/release/*.apk | head -n 1)
                  "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
                  "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk"
            - name: Remove the signing key
              if: always()
              run: rm -f "$RUNNER_TEMP/release.jks"
            # The mapping file is needed to read stack traces of this exact build: keep it with the release.
            - uses: actions/upload-artifact@v4
              with:
                  name: android-release
                  path: |
                      clients/android/app/build/outputs/apk/release/*.apk
                      clients/android/app/build/outputs/bundle/release/*.aab
                      clients/android/app/build/outputs/mapping/release/mapping.txt
                  if-no-files-found: error
