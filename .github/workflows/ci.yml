name: ci

on:
    push:
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --workspace

    deny:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: EmbarkStudios/cargo-deny-action@v2

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: peaceiris/actions-mdbook@v2
              with:
                  mdbook-version: latest
            - run: mdbook build doc
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo doc --workspace --no-deps
              env:
                  RUSTDOCFLAGS: -D warnings

    fuzz-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@nightly
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core/fuzz
            - run: cargo install cargo-fuzz --locked
            - name: Run every fuzz target briefly
              run: |
                  for target in $(cargo fuzz list --fuzz-dir core/fuzz); do
                      cargo fuzz run --fuzz-dir core/fuzz "$target" -- -max_total_time=30 -rss_limit_mb=2048
                  done

    bindings:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Generate the Kotlin and Swift bindings
              run: bash scripts/gen-bindings.sh
            - uses: actions/upload-artifact@v4
              with:
                  name: bindings
                  path: target/bindings
