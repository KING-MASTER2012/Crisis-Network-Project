name: ci

on:
    push:
    pull_request:

env:
    CARGO_TERM_COLOR: always

jobs:
    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --workspace --all-targets -- -D warnings

    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo test --workspace

    deny:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: EmbarkStudios/cargo-deny-action@v2

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: peaceiris/actions-mdbook@v2
              with:
                  mdbook-version: latest
            - run: mdbook build docs
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - run: cargo doc --workspace --no-deps
              env:
                  RUSTDOCFLAGS: -D warnings

    fuzz-smoke:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@nightly
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: core/fuzz
            - run: cargo install cargo-fuzz --locked
            - name: Run every fuzz target briefly
              run: |
                  for target in $(cargo fuzz list --fuzz-dir core/fuzz); do
                      cargo fuzz run --fuzz-dir core/fuzz "$target" -- -max_total_time=30 -rss_limit_mb=2048
                  done

    bindings:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Generate the Kotlin and Swift bindings
              run: bash scripts/gen-bindings.sh
            - uses: actions/upload-artifact@v4
              with:
                  name: bindings
                  path: target/bindings

    android:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            # The action's default package list contains `tools`, which no longer exists in the current
            # command-line tools ("Failed to find package 'tools'"). Name the packages explicitly instead.
            # Keep the NDK version in sync with clients/android/core/ffi/build.gradle.kts and the
            # platform / build-tools versions with clients/android/README.md.
            - uses: android-actions/setup-android@v3
              with:
                  packages: "platform-tools platforms;android-37 build-tools;36.0.0 ndk;28.2.13676358"
            - name: Install cargo-ndk
              run: cargo install cargo-ndk --locked
            - uses: gradle/actions/setup-gradle@v4
            - name: Make the Gradle wrapper executable
              run: chmod +x clients/android/gradlew
            - name: Build the debug APK and run lint
              working-directory: clients/android
              run: ./gradlew :app:assembleDebug :app:lintDebug :core:runtime:testDebugUnitTest --stacktrace
            - uses: actions/upload-artifact@v4
              with:
                  name: android-debug-apk
                  path: clients/android/app/build/outputs/apk/debug/*.apk

    # Runs the native core on an emulator (needs KVM, slow), so only on the main branch.
    android-smoke:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
            - uses: Swatinem/rust-cache@v2
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            # The action's default package list contains `tools`, which no longer exists in the current
            # command-line tools ("Failed to find package 'tools'"). Name the packages explicitly instead.
            # Keep the NDK version in sync with clients/android/core/ffi/build.gradle.kts and the
            # platform / build-tools versions with clients/android/README.md.
            - uses: android-actions/setup-android@v3
              with:
                  packages: "platform-tools platforms;android-37 build-tools;36.0.0 ndk;28.2.13676358"
            - name: Install cargo-ndk
              run: cargo install cargo-ndk --locked
            - uses: gradle/actions/setup-gradle@v4
            - name: Make the Gradle wrapper executable
              run: chmod +x clients/android/gradlew
            - name: Enable KVM for the emulator
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 33
                  arch: x86_64
                  working-directory: clients/android
                  script: ./gradlew :app:connectedDebugAndroidTest :core:runtime:connectedDebugAndroidTest --stacktrace
