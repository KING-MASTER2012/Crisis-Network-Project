org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Crisis Network build options (see clients/android/README.md) -------------------
# Cargo profile of the native core: `release` (default, LTO, small) or `dev` (fast builds).
crisis.rustProfile=release
# Build the core with SQLCipher (encrypted database). Needs Perl and make to build OpenSSL.
crisis.sqlcipher=false
# Skip the cargo steps and use the libraries and bindings that are already built.
crisis.skipRust=false
