# XcodeGen specification: `xcodegen generate` (in this folder) produces CrisisNetwork.xcodeproj, which is not
# committed. Install XcodeGen with `brew install xcodegen`.
name: CrisisNetwork

options:
    bundleIdPrefix: org.crisisnetwork
    deploymentTarget:
        iOS: "17.0"
        macOS: "14.0"
    createIntermediateGroups: true
    generateEmptyDirectories: true

configFiles:
    Debug: Config/Base.xcconfig
    Release: Config/Base.xcconfig

packages:
    CrisisCore:
        path: Packages/CrisisCore
    CrisisRuntime:
        path: Packages/CrisisRuntime

targets:
    CrisisNetwork-iOS:
        type: application
        platform: iOS
        sources:
            - path: App/Shared
        dependencies:
            - package: CrisisCore
            - package: CrisisRuntime
        info:
            path: App/iOS/Info.plist
            properties:
                CFBundleDisplayName: Crisis Network
                UILaunchScreen: {}
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                # Bluetooth in the background (phase I3): scanning and connections go on while the app is suspended, and the
                # system relaunches the app for a Bluetooth event (state restoration). Both ends are needed: every device is
                # a central and a peripheral at the same time.
                UIBackgroundModes:
                    - bluetooth-central
                    - bluetooth-peripheral
                # The reason shown to the person when Bluetooth is first used (phase I2 starts using it).
                NSBluetoothAlwaysUsageDescription: >-
                    Crisis Network uses Bluetooth to pass messages between nearby phones when there is no network.
                # Encryption is only used for the content of the app's own protocol; see the export compliance note in
                # clients/apple/README.md before the first App Store upload.
                ITSAppUsesNonExemptEncryption: false
        # The Keychain group of the app. An item is only usable with an application identifier; the simulator takes
        # it from the (ad-hoc) signature, see the iOS test step in .github/workflows/ci.yml.
        entitlements:
            path: App/iOS/CrisisNetwork.entitlements
            properties:
                keychain-access-groups:
                    - "$(AppIdentifierPrefix)$(APP_BUNDLE_ID)"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
                TARGETED_DEVICE_FAMILY: "1,2"
                GENERATE_INFOPLIST_FILE: NO
        scheme:
            testTargets:
                - CrisisNetworkTests-iOS

    CrisisNetwork-macOS:
        type: application
        platform: macOS
        sources:
            - path: App/Shared
        dependencies:
            - package: CrisisCore
            - package: CrisisRuntime
        info:
            path: App/macOS/Info.plist
            properties:
                CFBundleDisplayName: Crisis Network
                LSMinimumSystemVersion: "14.0"
                NSBluetoothAlwaysUsageDescription: >-
                    Crisis Network uses Bluetooth to pass messages between nearby devices when there is no network.
                ITSAppUsesNonExemptEncryption: false
        entitlements:
            path: App/macOS/CrisisNetwork.entitlements
            properties:
                com.apple.security.app-sandbox: true
                com.apple.security.device.bluetooth: true
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
                GENERATE_INFOPLIST_FILE: NO

    CrisisNetworkTests-iOS:
        type: bundle.unit-test
        platform: iOS
        sources:
            - path: Tests/iOS
        dependencies:
            - target: CrisisNetwork-iOS
            - package: CrisisCore
            - package: CrisisRuntime
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"
                GENERATE_INFOPLIST_FILE: YES
