# XcodeGen specification: `xcodegen generate` (in this folder) produces CrisisNetwork.xcodeproj, which is not
# committed. Install XcodeGen with `brew install xcodegen`.
name: CrisisNetwork

options:
    bundleIdPrefix: org.crisisnetwork
    deploymentTarget:
        iOS: "17.0"
        macOS: "14.0"
    createIntermediateGroups: true
    generateEmptyDirectories: true

configFiles:
    Debug: Config/Base.xcconfig
    Release: Config/Base.xcconfig

packages:
    CrisisCore:
        path: Packages/CrisisCore
    CrisisRuntime:
        path: Packages/CrisisRuntime

targets:
    CrisisNetwork-iOS:
        type: application
        platform: iOS
        sources:
            - path: App/Shared
        dependencies:
            - package: CrisisCore
            - package: CrisisRuntime
        info:
            path: App/iOS/Info.plist
            properties:
                CFBundleDisplayName: Crisis Network
                # The languages of the String Catalog (App/Shared/Resources/Localizable.xcstrings).
                CFBundleLocalizations:
                    - en
                    - tr
                UILaunchScreen: {}
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                # Bluetooth in the background (phase I3): scanning and connections go on while the app is suspended, and the
                # system relaunches the app for a Bluetooth event (state restoration). Both ends are needed: every device is
                # a central and a peripheral at the same time.
                UIBackgroundModes:
                    - bluetooth-central
                    - bluetooth-peripheral
                # The reason shown to the person when Bluetooth is first used (phase I2 starts using it).
                NSBluetoothAlwaysUsageDescription: >-
                    Crisis Network uses Bluetooth to pass messages between nearby phones when there is no network.
                # The camera reads the QR code of a contact card (phase I5); nothing is recorded or sent.
                NSCameraUsageDescription: >-
                    Crisis Network uses the camera only to read the QR code of a contact card. Nothing is recorded or sent anywhere.
                # Encryption is only used for the content of the app's own protocol; see the export compliance note in
                # clients/apple/README.md before the first App Store upload.
                ITSAppUsesNonExemptEncryption: false
        # The Keychain group of the app. An item is only usable with an application identifier; the simulator takes
        # it from the (ad-hoc) signature, see the iOS test step in .github/workflows/ci.yml.
        entitlements:
            path: App/iOS/CrisisNetwork.entitlements
            properties:
                keychain-access-groups:
                    - "$(AppIdentifierPrefix)$(APP_BUNDLE_ID)"
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
                TARGETED_DEVICE_FAMILY: "1,2"
                GENERATE_INFOPLIST_FILE: NO
        scheme:
            testTargets:
                - CrisisNetworkTests-iOS

    CrisisNetwork-macOS:
        type: application
        platform: macOS
        sources:
            - path: App/Shared
        dependencies:
            - package: CrisisCore
            - package: CrisisRuntime
        info:
            path: App/macOS/Info.plist
            properties:
                CFBundleDisplayName: Crisis Network
                # The languages of the String Catalog (App/Shared/Resources/Localizable.xcstrings).
                CFBundleLocalizations:
                    - en
                    - tr
                LSMinimumSystemVersion: "14.0"
                LSApplicationCategoryType: public.app-category.social-networking
                # One copy only: the database cannot be opened twice, and a login item and a double click must not
                # start a second one (phase I8).
                LSMultipleInstancesProhibited: true
                NSBluetoothAlwaysUsageDescription: >-
                    Crisis Network uses Bluetooth to pass messages between nearby devices when there is no network.
                # The camera reads the QR code of a contact card (phase I8); nothing is recorded or sent.
                NSCameraUsageDescription: >-
                    Crisis Network uses the camera only to read the QR code of a contact card. Nothing is recorded or sent anywhere.
                ITSAppUsesNonExemptEncryption: false
        # The rights of the sandboxed Mac app (phase I8). Exactly these four, and no network entitlement: the app talks
        # to other devices over Bluetooth only. `scripts/check-mac-app.sh` fails the build when one is missing or when a
        # forbidden one has appeared.
        #   app-sandbox                  the sandbox itself
        #   device.bluetooth             the Bluetooth radio (the permission dialog comes from NSBluetoothAlwaysUsageDescription)
        #   device.camera                the camera that reads a card's QR code
        #   files.user-selected.read-write  a picture the person picks or drops to read a card from, and the file the
        #                                person saves their own card's QR code to
        entitlements:
            path: App/macOS/CrisisNetwork.entitlements
            properties:
                com.apple.security.app-sandbox: true
                com.apple.security.device.bluetooth: true
                com.apple.security.device.camera: true
                com.apple.security.files.user-selected.read-write: true
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID)"
                GENERATE_INFOPLIST_FILE: NO
            # The hardened runtime is what notarization requires; Release only, because a debug build is loaded by test
            # bundles and debuggers that the hardened runtime would refuse. A Release build must not be debuggable either:
            # Xcode adds `com.apple.security.get-task-allow` to a locally signed build unless told not to, and notarization
            # refuses an app that has it. The entitlements the app needs are all declared above, so nothing is lost.
            configs:
                Release:
                    ENABLE_HARDENED_RUNTIME: YES
                    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

    CrisisNetworkTests-iOS:
        type: bundle.unit-test
        platform: iOS
        sources:
            - path: Tests/iOS
        dependencies:
            - target: CrisisNetwork-iOS
            - package: CrisisCore
            - package: CrisisRuntime
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: "$(APP_BUNDLE_ID).tests"
                GENERATE_INFOPLIST_FILE: YES
