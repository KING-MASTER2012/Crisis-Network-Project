[workspace]
members = [
    "core/crates/*",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.93.0"

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["default"] }
bincode = "3.0.0"
bytes = { version = "1.12.1", features = ["default", "serde"] }
ed25519-dalek = "3.0.0"
x25519-dalek = "3.0.0"
chacha20-poly1305 = "0.2.1"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
getrandom = "0.4.3"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }
anyhow = { version = "1.0.104", features = ["default", "std"] }
uuid = { version = "1.26.1", features = ["default", "serde"] }
chrono = "0.4.45"
tracing = { version = "0.1.44", features = ["tracing-attributes", "async-await"] }
tracing-subscriber = "0.3.23"
syn = { version = "3.0.6", features = ["default", "extra-traits"] }
proc-macro2 = { version = "1.0.107", features = ["default"] }
quote = { version = "1.0.47", features = ["default", "proc-macro"]}

crypto = { path = "core/crates/crypto" }
mesh = { path = "core/crates/mesh" }
storage = { path = "core/crates/storage" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
