[workspace]
members = [
    "core/crates/*",
]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.93.0"

[workspace.dependencies]
# --- Async / IO (storage, cli) ---
tokio = { version = "1.53.1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
bytes = { version = "1.12.1", features = ["default", "serde"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["default"] }

# --- Cryptography (crypto) ---
ed25519-dalek = "3.0.0"
x25519-dalek = "3.0.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = { version = "1.9.0", features = ["zeroize_derive"] }
getrandom = "0.4.3"

# --- Genel ---
thiserror = "2.0.21"
anyhow = { version = "1.0.104", features = ["default", "std"] }
uuid = { version = "1.26.1", features = ["default", "serde"] }
chrono = "0.4.45"
tracing = { version = "0.1.44", features = ["tracing-attributes", "async-await"] }
tracing-subscriber = "0.3.23"
uniffi = { version = "0.32.2", features = ["cli", "tokio"] }

# --- Test ---
proptest = "1.7.0"

# --- Ic crates ---
proto = { path = "core/crates/proto" }
crypto = { path = "core/crates/crypto" }
mesh = { path = "core/crates/mesh" }
storage = { path = "core/crates/storage" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.dev]
opt-level = 1
incremental = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
